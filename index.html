<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
<div class="container">
  <div class="input-section">
    <div class="input-group">
      <label for="day">DAY</label>
      <input type="number" id="day" placeholder="DD">
    </div>
    <div class="input-group">
      <label for="month">MONTH</label>
      <input type="number" id="month" placeholder="MM">
    </div>
    <div class="input-group">
      <label for="year">YEAR</label>
      <input type="number" id="year" placeholder="YYYY">
    </div>
  </div>

  <div class="button-section">
    <hr>
    <button id="calc-btn"><img src="images/icon-arrow.svg" alt="arrow"></button>
  </div>

  <div class="output-section">
    <h1><span id="out-years">--</span> years</h1>
    <h1><span id="out-months">--</span> months</h1>
    <h1><span id="out-days">--</span> days</h1>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
